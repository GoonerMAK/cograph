name: CI

on:
  push:
    # Release integration branches too: a PR that targets one of these otherwise
    # merges with no cross-platform check at all. That is how an MCP bug that made
    # every path-taking tool fail on Windows reached version_1.4.0 unnoticed.
    branches: [main, 'version_*']
  pull_request:
    branches: [main, 'version_*']

# The job only reads the checkout. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag can be moved to other
      # code, a SHA cannot. Dependabot keeps the SHA and the version comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
      - run: npm ci

      # The PR template asks for a clean lint; this is what enforces it.
      - run: npm run lint

      # Keep version in sync with VSCODE_VERSION in src/test/runTest.ts
      - name: Cache VS Code test binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-1.116.0

      - name: Run tests (Linux needs xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run tests
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run package
